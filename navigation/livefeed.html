---
layout: tailwind
title: Live Feed
permalink: /livefeed
---

<header class="heading">
  <h1 class="text-4xl font-bold text-center text-accent">🚦 Live Feed</h1>
  <p class="text-lg text-center text-gray-400">
    San Ysidro border crossing camera — see the latest traffic conditions below.
  </p>
  <div class="text-center text-gray-400 mt-2" id="liveClock"></div>
</header>

<style>
  .grid-container {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 2rem;
    padding: 2rem;
  }

  .card {
    background-color: var(--color-darker);
    border: 1px solid #3c4c60;
    border-radius: 1rem;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    padding: 2rem;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .card:hover {
    transform: translateY(-5px);
    box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
  }

  video {
    width: 100%;
    height: auto;
    border: 2px solid var(--color-accent);
    border-radius: 12px;
  }

  #current-time {
    font-size: 1.25rem;
    margin-bottom: 1rem;
    color: var(--color-accent);
    font-weight: bold;
  }

  .btn-timelapse {
    display: block;
    margin: 1rem auto;
    background-color: var(--color-accent);
    color: white;
    border: none;
    padding: 0.75rem 1.5rem;
    font-size: 1rem;
    border-radius: 8px;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }

  .btn-timelapse:hover {
    background-color: #2a6db0;
  }

  .status {
    text-align: center;
    font-weight: bold;
    margin-top: 1rem;
    color: var(--color-success);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 1rem;
  }

  th,
  td {
    padding: 0.75rem 1rem;
    border-bottom: 1px solid #3c4c60;
    text-align: left;
  }

  th {
    background-color: var(--color-dark);
    color: var(--color-accent);
    position: sticky;
    top: 0;
  }

  tr:hover {
    background-color: #2a2e38;
  }

  body.bg-white {
    background-color: white;
    color: black;
  }
</style>

<div class="grid-container">
  <div class="card">
    <div id="current-time">Searching for the latest working video...</div>
    <video id="borderVideo" controls autoplay muted></video>

    <div class="text-center mt-4">
      <label class="text-gray-300 mr-2">Speed:</label>
      <select id="playbackSpeed" class="bg-gray-800 text-white p-1 rounded">
        <option value="0.5">0.5x</option>
        <option value="1" selected>1x</option>
        <option value="1.5">1.5x</option>
        <option value="2">2x</option>
      </select>
    </div>

    <button id="generateTimelapseBtn" class="btn-timelapse">⏱️ Generate Timelapse (Past 5 hours)</button>

    <p id="timelapseStatus" class="status"></p>
  </div>

  <div class="card">
    <h2 class="text-xl font-semibold text-accent">🕒 Previous Working Videos</h2>
    <table id="historyTable">
      <thead>
        <tr>
          <th>Timestamp (click to view)</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script type="module">
  import {
    pythonURI,
    fetchOptions,
  } from "{{ site.baseurl }}/assets/js/api/config.js";

  const video = document.getElementById("borderVideo");
  const historyTable = document.querySelector("#historyTable tbody");
  const currentDisplay = document.getElementById("current-time");
  const status = document.getElementById("timelapseStatus");

  const now = new Date();
  const pad = (n) => n.toString().padStart(2, "0");
  const baseURL =
    "https://www.bordertraffic.com/videoclips/free_california-baja_sanysidro-tijuana_passengerlines_0_255_";

  const year = now.getFullYear();
  const month = pad(now.getMonth() + 1);
  const day = pad(now.getDate());
  const datePart = `${year}_${month}_${day}`;

  const attempts = [];
  for (let i = 0; i <= 300; i++) {
    const trial = new Date(now.getTime() - i * 60000);
    const hr = pad(trial.getHours());
    const min = pad(trial.getMinutes());
    const timeLabel = `${hr}:${min}`;
    const timeCode = `${hr}_${min}`;
    const url = `${baseURL}${datePart}_${timeCode}.mp4`;
    attempts.push({ url, timeLabel, timeCode });
  }

  const successfulVideos = [];

  function getProxiedURL(url) {
    return `${pythonURI}/api/timelapse/proxy_video?url=${encodeURIComponent(url)}`;
  }

  function tryMainVideo(index = 0) {
    if (index >= attempts.length) {
      currentDisplay.textContent = "No working videos found in the past 300 minutes.";
      return;
    }

    const proxyURL = getProxiedURL(attempts[index].url);
    video.src = proxyURL;
    video.onerror = () => tryMainVideo(index + 1);
    video.onloadeddata = () => {
      const { url, timeLabel, timeCode } = attempts[index];
      currentDisplay.innerHTML = `🎥 <strong>Now playing:</strong> ${timeLabel}`;
      addToTable(url, timeLabel, timeCode, true);
    };
  }

  function addToTable(url, timeLabel, timeCode, highlight = false) {
    if (successfulVideos.find((v) => v.timeCode === timeCode)) return;
    successfulVideos.push({ url, timeLabel, timeCode });

    historyTable.innerHTML = "";
    const sorted = successfulVideos.sort((a, b) =>
      a.timeCode.localeCompare(b.timeCode)
    );

    sorted.forEach(({ url, timeLabel, timeCode }) => {
      const proxyURL = getProxiedURL(url);
      const row = document.createElement("tr");
      const cell = document.createElement("td");
      const link = document.createElement("a");
      const trafficSpan = document.createElement("span");

      link.href = "#";
      link.textContent = `${timeLabel} (${timeCode})`;
      link.onclick = (e) => {
        e.preventDefault();
        video.src = proxyURL;
        video.load();
        currentDisplay.innerHTML = `🎥 <strong>Now playing:</strong> ${timeLabel}`;
      };

      cell.appendChild(link);
      cell.appendChild(trafficSpan);
      row.appendChild(cell);
      historyTable.appendChild(row);

      // Analyze traffic using proxied URL
      analyzeTraffic(proxyURL).then((label) => {
        trafficSpan.innerHTML = ` &nbsp; <span style="color:gray">[${label}]</span>`;
      });
    });
  }

  function scanAllPastVideos() {
    attempts.forEach(({ url, timeLabel, timeCode }) => {
      const testVideo = document.createElement("video");
      testVideo.src = getProxiedURL(url);
      testVideo.muted = true;
      testVideo.onloadeddata = () => {
        addToTable(url, timeLabel, timeCode);
      };
    });
  }

  document.getElementById("generateTimelapseBtn").addEventListener("click", async () => {
    status.textContent = "⏳ Generating timelapse... please wait";

    const urls = successfulVideos.map((v) => v.url);
    if (urls.length === 0) {
      status.textContent = "⚠️ No videos available to generate timelapse.";
      return;
    }

    try {
      const response = await fetch(`${pythonURI}/api/timelapse/`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ videos: urls }),
      });

      if (!response.ok) {
        const error = await response.json();
        status.textContent = `❌ Failed: ${error.error || "Unknown error"}`;
        return;
      }

      const blob = await response.blob();
      const videoURL = URL.createObjectURL(blob);
      video.src = videoURL;
      video.load();

      const base = new Date(successfulVideos[0].timeLabel);
      successfulVideos.forEach((entry) => {
        const t = new Date(entry.timeLabel);
        entry.offset = (t - base) / 1000;
      });

      video.onloadedmetadata = () => {
        historyTable.querySelectorAll("a").forEach((link, i) => {
          link.onclick = (e) => {
            e.preventDefault();
            video.currentTime = successfulVideos[i].offset;
            currentDisplay.innerHTML = `🎥 <strong>Jumped to:</strong> ${successfulVideos[i].timeLabel}`;
          };
        });
      };

      status.innerHTML = `
        ✅ Timelapse ready: <a href="${videoURL}" target="_blank">Click to view</a>
        <br/><a href="${videoURL}" download="timelapse.mp4" class="btn-timelapse mt-2">⬇️ Download Timelapse</a>`;
    } catch (err) {
      console.error("Timelapse generation failed:", err);
      status.textContent = "❌ Timelapse generation failed due to a network or server error.";
    }
  });

  document.getElementById("playbackSpeed").addEventListener("change", (e) => {
    video.playbackRate = parseFloat(e.target.value);
  });

  setInterval(() => {
    const t = new Date();
    document.getElementById("liveClock").textContent =
      `🕓 Local Time: ${t.toLocaleTimeString()}`;
  }, 1000);

  async function analyzeTraffic(proxiedURL) {
    return new Promise((resolve) => {
      const tempVideo = document.createElement("video");
      tempVideo.src = proxiedURL;
      tempVideo.muted = true;
      tempVideo.crossOrigin = "anonymous";
      tempVideo.currentTime = 0;

      tempVideo.addEventListener("loadeddata", () => {
        const canvas = document.getElementById("frameCanvas");
        const ctx = canvas.getContext("2d");

        canvas.width = tempVideo.videoWidth;
        canvas.height = tempVideo.videoHeight;
        ctx.drawImage(tempVideo, 0, 0, canvas.width, canvas.height);

        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const pixels = imageData.data;
        let darkPixelCount = 0;

        for (let i = 0; i < pixels.length; i += 4) {
          const r = pixels[i];
          const g = pixels[i + 1];
          const b = pixels[i + 2];
          const brightness = (r + g + b) / 3;
          if (brightness < 80) darkPixelCount++;
        }

        const density = darkPixelCount / (canvas.width * canvas.height);
        let label = "Unknown";
        if (density < 0.05) label = "🚗 Light";
        else if (density < 0.12) label = "🚙 Moderate";
        else label = "🚛 Heavy";

        resolve(label);
      });

      tempVideo.onerror = () => {
        resolve("⚠️ Error");
      };
    });
  }

  async function fetchStoredVideos() {
    const res = await fetch(`${pythonURI}/api/timelapse/history`);
    const data = await res.json();
    data.forEach(({ url, timeLabel, timeCode }) => {
        addToTable(url, timeLabel, timeCode);
    });
  }

  fetchStoredVideos();
  tryMainVideo();
  scanAllPastVideos();
</script>

<canvas id="frameCanvas" width="640" height="360" style="display: none;"></canvas>
