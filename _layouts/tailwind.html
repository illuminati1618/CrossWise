---
layout: null
---

<script type="module" src="{{ site.baseurl }}/assets/js/api/login.js"></script>

<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page.title | escape }}</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              dark: "var(--color-dark)",
              darker: "var(--color-darker)",
              accent: "var(--color-accent)",
              success: "var(--color-success)",
              warning: "var(--color-warning)",
            },
          },
        },
      };
    </script>

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Custom Styles -->
    <style>
      :root {
        --color-dark: #121212;
        --color-darker: #1e1e1e;
        --color-accent: #4285f4;
        --color-success: #34a853;
        --color-warning: #fbbc05;
      }

      body {
        font-family: "Inter", sans-serif;
        background-color: var(--color-darker);
        color: #f0f4f8;
        text-shadow: none;
      }

      h1,
      h2,
      h3,
      p,
      label,
      input,
      select,
      button,
      option {
        text-shadow: none !important;
        background: transparent;
        color: inherit;
      }

      select,
      option {
        background-color: var(--color-darker);
        color: #f0f4f8;
        border: 1px solid #3c4c60;
      }

      ::selection {
        background: var(--color-accent);
        color: white;
      }

      .logo-link {
        display: inline-flex;
        align-items: center;
        text-decoration: none;
        color: inherit;
        transition: all 0.2s ease-in-out;
      }

      .logo-link:hover {
        transform: translateY(-1px);
      }

      .logo-link:hover svg {
        transform: scale(1.1);
      }

      .nav-link {
        display: inline-flex;
        align-items: center;
        padding: 0.5rem 0.75rem;
        border-radius: 0.5rem;
        transition: all 0.2s ease-in-out;
        text-decoration: none;
        color: #d1d5db;
      }

      .nav-link:hover {
        background-color: rgba(66, 133, 244, 0.1);
        color: var(--color-accent);
        transform: translateY(-1px);
      }

      .nav-link svg {
        transition: all 0.2s ease-in-out;
      }

      .nav-link:hover svg {
        transform: scale(1.1);
      }

      .nav-link-text {
        margin-left: 0.5rem;
        font-size: 0.875rem;
        font-weight: 500;
      }

      /* Dropdown Styles */
      .dropdown {
        position: relative;
        display: inline-block;
      }

      .dropdown-content {
        position: absolute;
        top: 100%;
        right: 0;
        background-color: var(--color-dark);
        min-width: 180px;
        border: 1px solid #3c4c60;
        border-radius: 0.5rem;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        z-index: 1000;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-10px);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        margin-top: 0.5rem;
      }

      .dropdown:hover .dropdown-content {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }

      .dropdown-item {
        display: flex;
        align-items: center;
        padding: 0.75rem 1rem;
        color: #d1d5db;
        text-decoration: none;
        transition: all 0.2s ease-in-out;
        border-radius: 0.375rem;
        margin: 0.25rem;
        font-size: 0.875rem;
        font-weight: 500;
      }

      .dropdown-item:hover {
        background-color: rgba(66, 133, 244, 0.1);
        color: var(--color-accent);
        transform: translateX(4px);
      }

      .dropdown-item svg {
        transition: all 0.2s ease-in-out;
        margin-right: 0.5rem;
      }

      .dropdown-item:hover svg {
        transform: scale(1.1);
        color: var(--color-accent);
      }

      .dropdown-separator {
        height: 1px;
        background-color: #3c4c60;
        margin: 0.25rem 0;
      }

      /* Arrow indicator for dropdown */
      .dropdown-trigger::after {
        content: '';
        display: inline-block;
        width: 0;
        height: 0;
        margin-left: 0.5rem;
        border-left: 4px solid transparent;
        border-right: 4px solid transparent;
        border-top: 4px solid currentColor;
        transition: transform 0.2s ease-in-out;
      }

      .dropdown:hover .dropdown-trigger::after {
        transform: rotate(180deg);
      }

      @media (max-width: 768px) {
        .nav-link-text {
          display: none;
        }
        
        .dropdown-content {
          right: -50px;
          min-width: 160px;
        }
      }

      .dropdown-nested {
        position: relative;
      }

      .dropdown-nested-content {
        position: absolute;
        top: 0;
        left: 100%;
        background-color: var(--color-dark);
        min-width: 140px; /* Changed from 160px to 140px */
        border: 1px solid #3c4c60;
        border-radius: 0.5rem;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        z-index: 1001;
        opacity: 0;
        visibility: hidden;
        transform: translateX(-10px);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        margin-left: 0.5rem;
      }
      
      .dropdown-nested:hover .dropdown-nested-content {
        opacity: 1;
        visibility: visible;
        transform: translateX(0);
      }

      .dropdown-nested-item {
        display: flex;
        align-items: center;
        padding: 0.6rem 0.8rem; /* Changed from 0.75rem 1rem */
        color: #d1d5db;
        text-decoration: none;
        transition: all 0.2s ease-in-out;
        border-radius: 0.375rem;
        margin: 0.25rem;
        font-size: 0.875rem;
        font-weight: 500;
      }

      .dropdown-nested-item:hover {
        background-color: rgba(66, 133, 244, 0.1);
        color: var(--color-accent);
        transform: translateX(4px);
      }

      .dropdown-nested-item svg {
        transition: all 0.2s ease-in-out;
        margin-right: 0.5rem;
      }

      .dropdown-nested-item:hover svg {
        transform: scale(1.1);
        color: var(--color-accent);
      }

      .dropdown-nested-trigger::after {
        content: '';
        display: inline-block;
        width: 0;
        height: 0;
        margin-left: auto;
        border-top: 4px solid transparent;
        border-bottom: 4px solid transparent;
        border-left: 4px solid currentColor;
        transition: transform 0.2s ease-in-out;
      }

      .dropdown-nested-content .dropdown-separator {
        height: 1px;
        background-color: #3c4c60;
        margin: 0.25rem 0.75rem; /* Partial separator with left/right margins */
      }

    </style>
  </head>
  <body class="bg-darker text-gray-200">
    <!-- Header -->
    <header class="bg-dark shadow-md py-6">
      <div class="max-w-7xl mx-auto px-4 flex justify-between items-center">
        <a href="{{ site.baseurl }}/" class="logo-link mr-8">
          <svg class="w-8 h-8 mr-3 text-accent" fill="currentColor" viewBox="0 0 20 20">
            <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/>
          </svg>
          <h1 class="text-3xl font-bold text-accent">CrossWise</h1>
        </a>
        <nav class="flex items-center space-x-4">
          <!-- Live -->
          <a href="{{ site.baseurl }}/livefeed" class="nav-link" title="Live Camera">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
              <path d="M2 6a2 2 0 012-2h6a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V6zM14.553 7.106A1 1 0 0014 8v4a1 1 0 00.553.894l2 1A1 1 0 0018 13V7a1 1 0 00-1.447-.894l-2 1z"/>
            </svg>
            <span class="nav-link-text">Live</span>
          </a>

          <!-- Weather -->
          <a href="{{ site.baseurl }}/weather" class="nav-link" title="Weather">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M5.5 17a4.5 4.5 0 01-1.44-8.765 4.5 4.5 0 018.302-3.046 3.5 3.5 0 014.504 4.272A4 4 0 0115 17H5.5zm3.75-2a.75.75 0 00-1.5 0v.5a.75.75 0 001.5 0V15zm2.25.75a.75.75 0 01.75-.75h.5a.75.75 0 010 1.5H12a.75.75 0 01-.75-.75zM10 12a.75.75 0 00-.75.75v.5a.75.75 0 001.5 0v-.5A.75.75 0 0010 12z" clip-rule="evenodd"/>
            </svg>
            <span class="nav-link-text">Weather</span>
          </a>

          <!-- Calendar -->
          <a href="{{ site.baseurl }}/calendar" class="nav-link" title="Calendar">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd"/>
            </svg>
            <span class="nav-link-text">Calendar</span>
          </a>

          <!-- Historical -->
          <a href="{{ site.baseurl }}/historicaldata" class="nav-link" title="Historical Data">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
              <path d="M2 11a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1v-5zM8 7a1 1 0 011-1h2a1 1 0 011 1v9a1 1 0 01-1 1H9a1 1 0 01-1-1V7zM14 4a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1h-2a1 1 0 01-1-1V4z"/>
            </svg>
            <span class="nav-link-text">Historical</span>
          </a>

          <!-- Directions -->
          <a href="{{ site.baseurl }}/directions" class="nav-link" title="Directions">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M12.293 5.293a1 1 0 011.414 0l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-2.293-2.293a1 1 0 010-1.414z" clip-rule="evenodd"/>
            </svg>
            <span class="nav-link-text">Directions</span>
          </a>

          <!-- Help Dropdown -->
          <div class="dropdown">
            <a href="{{ site.baseurl }}/help" class="nav-link dropdown-trigger" title="Help & Support">
              <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-8-3a1 1 0 00-.867.5 1 1 0 11-1.731-1A3 3 0 0113 8a3.001 3.001 0 01-2 2.83V11a1 1 0 11-2 0v-1a1 1 0 011-1 1 1 0 100-2zm0 8a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd"/>
              </svg>
              <span class="nav-link-text">Help</span>
            </a>
            <div class="dropdown-content">
              <div class="dropdown-nested">
                <div class="dropdown-item dropdown-nested-trigger">
                  <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"/>
                    <path fill-rule="evenodd" d="M4 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v6h-4.586l1.293-1.293a1 1 0 00-1.414-1.414l-3 3a1 1 0 000 1.414l3 3a1 1 0 001.414-1.414L12.586 13H17v3a2 2 0 01-2 2H5a2 2 0 01-2-2V5z" clip-rule="evenodd"/>
                  </svg>
                  <span>Forms</span>
                </div>
              <div class="dropdown-nested-content">
                <a href="{{ site.baseurl }}/crosswiseforms" class="dropdown-nested-item">
                  <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"/>
                    <path fill-rule="evenodd" d="M4 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v6h-4.586l1.293-1.293a1 1 0 00-1.414-1.414l-3 3a1 1 0 000 1.414l3 3a1 1 0 001.414-1.414L12.586 13H17v3a2 2 0 01-2 2H5a2 2 0 01-2-2V5z" clip-rule="evenodd"/>
                  </svg>
                  <span>Feedback</span>
                </a>
                <div class="dropdown-separator"></div>
                <a href="{{ site.baseurl }}/traffic-report" class="dropdown-nested-item">
                  <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
                  </svg>
                  <span>Traffic</span>
                </a>
              </div>
              </div>
              <div class="dropdown-separator"></div>
              <a href="{{ site.baseurl }}/contact" class="dropdown-item">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                  <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"/>
                  <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"/>
                </svg>
                <span>Contact</span>
              </a>
            </div>
          </div>

          <!-- Search -->
          <a href="{{ site.baseurl }}/search" class="nav-link" title="Search">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/>
            </svg>
            <span class="nav-link-text">Search</span>
          </a>

          <!-- Dashboard -->
          <a href="{{ site.baseurl }}/dashboard/" class="nav-link" title="Dashboard">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
              <path d="M3 4a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1V4zM3 10a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H4a1 1 0 01-1-1v-6zM14 9a1 1 0 00-1 1v6a1 1 0 001 1h2a1 1 0 001-1v-6a1 1 0 00-1-1h-2z"/>
            </svg>
            <span class="nav-link-text">Dashboard</span>
          </a>

          <!-- Login -->
          <span class="nav-link" data-baseurl="{{ site.baseurl }}">
            <span id="loginArea" class="nav-link trigger" data-baseurl="{{ site.baseurl }}">
              <a href="{{ site.baseurl }}/login" class="nav-link" title="Login">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                  <path fill-rule="evenodd" d="M3 3a1 1 0 011 1v12a1 1 0 11-2 0V4a1 1 0 011-1zm7.707 3.293a1 1 0 010 1.414L9.414 9H17a1 1 0 110 2H9.414l1.293 1.293a1 1 0 01-1.414 1.414l-3-3a1 1 0 010-1.414l3-3a1 1 0 011.414 0z" clip-rule="evenodd"/>
                </svg>
                <span class="nav-link-text">Login</span>
              </a>
            </span>               
          </span>
        </nav>
      </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-10 space-y-12">{{ content }}</main>

    <!-- Footer -->
    <footer class="bg-dark border-t border-gray-700 py-6 mt-12">
      <div class="max-w-7xl mx-auto px-4 text-center text-sm text-gray-400">
        © {{ site.time | date: "%Y" }} CrossWise — All rights reserved.
      </div>
    </footer>
  </body>
</html>
